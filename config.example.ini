# =============================================================================
# File:           config.example.ini
# Purpose:        Example configuration for the DSCP server and client.
#                 Copy this file to "config.ini" and edit the copy.
#                 config.ini holds a secret key, so it is NOT part of the
#                 deliverable and must never be committed or shared publicly.
# Primary member: Seth (security: TLS, HMAC, logging)
# =============================================================================

[network]
# CLIENT: the address of the owner's device (the server).
# Use 127.0.0.1 when both programs run on the same computer.
server_host = 127.0.0.1

# SERVER: the address to listen on. 0.0.0.0 = all network interfaces, so
# other devices can connect. Use 127.0.0.1 to accept only local connections.
bind_host = 0.0.0.0

# The DSCP port (the spec fixes this at 5050). Must match on both sides.
port = 5050

# SERVER: seconds of inactivity (from the requester OR from the owner at the
# consent prompt) before the server sends ERR 408 and ends the session.
timeout_seconds = 60

# CLIENT: seconds to wait for a reply. Longer than the server timeout because
# the owner may answer several consent questions, each with its own timeout.
reply_timeout_seconds = 300

[security]
# Pre-shared key for HMAC-SHA256. Must be IDENTICAL on server and client and
# at least 16 characters long. Generate one with:
#   python -c "import secrets; print(secrets.token_hex(32))"
# The environment variable DSCP_PSK, if set, is used instead of this value.
psk = CHANGE_ME

# TLS certificate and private key, created by:  python generate_cert.py
# Paths are relative to the project folder unless they are absolute.
# The client needs a copy of cert_file only. key_file stays on the server.
cert_file = certs/server.crt
key_file = certs/server.key

[logging]
# Folder for server.log and client.log (created automatically).
log_dir = logs
